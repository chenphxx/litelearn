<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiteLearn</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- 顶部工具栏 -->
      <header class="toolbar">
        <button id="btn-sidebar-toggle" class="btn icon" type="button" title="折叠/展开侧边栏"></button>
        <button id="conn-status" class="conn-status" type="button" title="数据库连接状态, 点击打开设置">
          <span id="conn-dot" class="conn-dot"></span>
          <span id="conn-text">未连接</span>
        </button>
        <input
          id="search-input"
          type="text"
          placeholder="搜索中文/英文索引或编号, 输入 000 查看全部"
          autocomplete="off"
        />
        <button id="btn-search" class="btn primary" type="button"></button>
        <span class="spacer"></span>
        <button id="btn-new-data" class="btn primary" type="button"></button>
        <button id="btn-history" class="btn icon" type="button" title="历史记录"></button>
        <button id="btn-theme" class="btn icon" type="button" title="切换主题"></button>
        <button id="btn-more" class="btn icon" type="button" title="更多操作"></button>
        <div id="more-menu" class="more-menu" hidden>
          <button data-action="new-stack" type="button">新建技术栈</button>
          <button data-action="export" type="button">导出备份</button>
          <button data-action="import" type="button">导入备份</button>
          <button data-action="sql" type="button">SQL 控制台</button>
          <button data-action="recycle" type="button">回收站</button>
          <button data-action="history" type="button">历史记录</button>
          <button data-action="settings" type="button">数据库设置</button>
        </div>
      </header>

      <!-- 主体区域: 左侧技术栈与结果列表 + 右侧详情 -->
      <main class="main">
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-head">
            <span class="sidebar-title">技术栈</span>
            <button id="btn-new-stack" class="btn icon small" type="button" title="新建技术栈"></button>
          </div>
          <div id="sidebar-list" class="sidebar-list"></div>
          <div class="sidebar-foot">
            共 <span id="sidebar-total">0</span> 篇文章
          </div>
        </aside>

        <section class="result-panel">
          <table id="result-table">
            <thead>
              <tr>
                <th class="col-id" data-sort="id">编号</th>
                <th class="col-stack">技术栈</th>
                <th>中文索引</th>
                <th>英文索引</th>
                <th class="col-time" data-sort="updated">更新时间</th>
              </tr>
            </thead>
            <tbody id="result-body"></tbody>
          </table>
          <div id="result-state" class="result-state" hidden>
            <p id="result-state-text"></p>
            <button id="btn-result-action" class="btn" type="button" hidden></button>
          </div>
          <div class="result-foot">
            <span id="result-meta"></span>
            <button id="btn-load-more" class="btn small" type="button" hidden>加载更多</button>
          </div>
        </section>

        <div id="splitter" class="splitter" title="拖动调整详情区宽度"></div>

        <section id="detail-panel" class="detail-panel">
          <div id="detail-empty" class="detail-empty">
            <p>从左侧列表选择一篇文章查看详情</p>
          </div>
          <div id="detail-body" class="detail-body" hidden>
            <div class="detail-header">
              <h3>文章 <span id="code-id" class="snippet-id"></span></h3>
              <div class="btn-group">
                <button id="btn-code-copy" class="btn small" type="button">复制</button>
                <button id="btn-code-copy-md" class="btn small" type="button">复制 MD</button>
                <button id="btn-code-export" class="btn small" type="button">导出 MD</button>
                <button id="btn-code-clone" class="btn small" type="button">克隆</button>
                <button id="btn-code-save" class="btn small primary" type="button">保存</button>
              </div>
            </div>
            <div class="detail-meta">
              <span id="detail-stack" class="meta-stack"></span>
              <span>创建 <span id="detail-created"></span></span>
              <span>更新 <span id="detail-updated"></span></span>
              <span id="detail-lines"></span>
            </div>
            <div id="content-editor" class="editor-host content-editor"></div>

            <div class="detail-footer">
              <button id="btn-delete" class="btn danger" type="button">移入回收站</button>
            </div>
          </div>
        </section>
      </main>

      <!-- 底部状态栏 -->
      <footer id="statusbar">就绪</footer>
    </div>

    <div id="toast-layer" class="toast-layer"></div>
    <div id="drop-hint" class="drop-hint" hidden>松开鼠标导入备份文件</div>

    <!-- 新增数据弹窗 -->
    <dialog id="new-data-dialog" class="dialog resizable-dialog">
      <div class="dialog-box">
        <h3 id="new-data-title" class="drag-handle">新增数据</h3>
        <div class="form-row">
          <label for="new-data-stack">技术栈</label>
          <select id="new-data-stack"></select>
        </div>
        <div class="form-row">
          <label for="new-data-zh-index">中文索引</label>
          <input id="new-data-zh-index" type="text" />
        </div>
        <div class="form-row">
          <label for="new-data-en-index">英文索引</label>
          <input id="new-data-en-index" type="text" />
        </div>
        <div class="form-row form-row-block">
          <label for="new-data-code">正文</label>
          <textarea id="new-data-code" spellcheck="false" placeholder="在此撰写知识点文章, 支持 Markdown 与代码块"></textarea>
        </div>
        <div class="dialog-buttons">
          <button id="btn-new-data-save" class="btn primary" type="button">保存</button>
          <button id="btn-new-data-cancel" class="btn" type="button">取消</button>
        </div>
      </div>
      <div class="resize-handle"></div>
    </dialog>

    <!-- 技术栈编辑弹窗 -->
    <dialog id="stack-dialog" class="dialog resizable-dialog">
      <div class="dialog-box">
        <h3 id="stack-dialog-title" class="drag-handle">新建技术栈</h3>
        <div class="form-row">
          <label for="stack-name">名称</label>
          <input id="stack-name" type="text" />
        </div>
        <div class="form-row form-row-block">
          <label for="stack-description">描述</label>
          <textarea id="stack-description" spellcheck="false"></textarea>
        </div>
        <div id="stack-status" class="setting-status"></div>
        <div class="dialog-buttons">
          <button id="btn-stack-delete" class="btn danger push-left" type="button" hidden>删除技术栈</button>
          <button id="btn-stack-save" class="btn primary" type="button">保存</button>
          <button id="btn-stack-cancel" class="btn" type="button">取消</button>
        </div>
      </div>
      <div class="resize-handle"></div>
    </dialog>

    <!-- 数据库设置弹窗 -->
    <dialog id="settings-dialog" class="dialog resizable-dialog">
      <div class="dialog-box">
        <h3 class="drag-handle">数据库设置</h3>
        <div class="form-row">
          <label for="setting-host">数据库地址</label>
          <input id="setting-host" type="text" />
        </div>
        <div class="form-row">
          <label for="setting-port">端口</label>
          <input id="setting-port" type="number" />
        </div>
        <div class="form-row">
          <label for="setting-user">用户名</label>
          <input id="setting-user" type="text" />
        </div>
        <div class="form-row">
          <label for="setting-password">密码</label>
          <div class="password-field">
            <input id="setting-password" type="password" autocomplete="off" />
            <button id="btn-toggle-password" class="password-eye" type="button" title="显示/隐藏密码"></button>
          </div>
        </div>
        <div class="form-row">
          <label for="setting-database">数据库名</label>
          <input id="setting-database" type="text" />
        </div>
        <div id="setting-status" class="setting-status"></div>
        <div class="dialog-buttons">
          <button id="btn-setting-test" class="btn" type="button">测试连接</button>
          <button id="btn-setting-save" class="btn primary" type="button">保存并应用</button>
          <button id="btn-setting-cancel" class="btn" type="button">关闭</button>
        </div>
      </div>
      <div class="resize-handle"></div>
    </dialog>

    <!-- 导出备份弹窗 -->
    <dialog id="export-dialog" class="dialog resizable-dialog">
      <div class="dialog-box">
        <h3 class="drag-handle">导出备份</h3>
        <div class="form-row">
          <label for="export-format">导出格式</label>
          <select id="export-format">
            <option value="json">JSON(完整备份)</option>
            <option value="csv">CSV(表格数据)</option>
          </select>
        </div>
        <div class="form-row">
          <label for="export-path">保存位置</label>
          <input id="export-path" type="text" readonly placeholder="点击浏览选择保存位置" />
          <button id="btn-export-browse" class="btn small" type="button">浏览...</button>
        </div>
        <div id="export-status" class="setting-status"></div>
        <div class="dialog-buttons">
          <button id="btn-export-save" class="btn primary" type="button">导出</button>
          <button id="btn-export-cancel" class="btn" type="button">关闭</button>
        </div>
      </div>
      <div class="resize-handle"></div>
    </dialog>

    <!-- 导入备份弹窗 -->
    <dialog id="import-dialog" class="dialog resizable-dialog">
      <div class="dialog-box">
        <h3 class="drag-handle">导入备份</h3>
        <div class="form-row">
          <label for="import-path">备份文件</label>
          <input id="import-path" type="text" readonly placeholder="点击浏览选择备份文件, 也可直接拖入窗口" />
          <button id="btn-import-browse" class="btn small" type="button">浏览...</button>
        </div>
        <div id="import-status" class="setting-status"></div>
        <div id="import-preview" class="preview-box" hidden></div>
        <label class="checkbox-row">
          <input id="import-overwrite" type="checkbox" />
          <span>覆盖同编号文章(按备份中的编号更新已有数据)</span>
        </label>
        <div class="dialog-buttons">
          <button id="btn-import-save" class="btn primary" type="button" disabled>导入</button>
          <button id="btn-import-cancel" class="btn" type="button">关闭</button>
        </div>
      </div>
      <div class="resize-handle"></div>
    </dialog>

    <!-- SQL 控制台弹窗 -->
    <dialog id="sql-dialog" class="dialog resizable-dialog">
      <div class="dialog-box sql-box">
        <h3 class="drag-handle">SQL 控制台</h3>
        <textarea
          id="sql-input"
          spellcheck="false"
          placeholder="输入单条 SQL 语句, 按 Ctrl+Enter 执行"
        ></textarea>
        <div class="sql-toolbar">
          <label class="checkbox-row">
            <input id="sql-readonly" type="checkbox" checked />
            <span>只读模式(拦截写操作)</span>
          </label>
          <span class="spacer"></span>
          <button id="btn-sql-run" class="btn primary" type="button">执行</button>
          <button id="btn-sql-clear" class="btn" type="button">清空</button>
          <button id="btn-sql-close" class="btn" type="button">关闭</button>
        </div>
        <div id="sql-history-bar" class="sql-history-bar" hidden>
          <div id="sql-history" class="history-list sql-history"></div>
          <button id="btn-sql-history-clear" class="btn small" type="button">清空历史</button>
        </div>
        <div id="sql-result" class="sql-result"></div>
      </div>
      <div class="resize-handle"></div>
    </dialog>

    <!-- 回收站弹窗 -->
    <dialog id="recycle-dialog" class="dialog resizable-dialog">
      <div class="dialog-box recycle-box">
        <h3 class="drag-handle">回收站</h3>
        <div class="dialog-toolbar">
          <span id="recycle-status" class="setting-status"></span>
          <span class="spacer"></span>
          <button id="btn-recycle-clear" class="btn small danger" type="button">清空回收站</button>
          <button id="btn-recycle-close" class="btn small" type="button">关闭</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th class="col-id">编号</th>
                <th>技术栈</th>
                <th>中文索引</th>
                <th>英文索引</th>
                <th class="col-time">删除时间</th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody id="recycle-body"></tbody>
          </table>
        </div>
        <p id="recycle-empty" class="empty-tip">回收站为空</p>
      </div>
      <div class="resize-handle"></div>
    </dialog>

    <!-- 历史记录弹窗 -->
    <dialog id="history-dialog" class="dialog resizable-dialog">
      <div class="dialog-box history-box">
        <h3 class="drag-handle">历史记录</h3>
        <div class="history-columns">
          <div class="history-column">
            <h4>搜索历史</h4>
            <div id="history-search-list" class="history-list"></div>
            <p id="history-search-empty" class="empty-tip">暂无搜索记录</p>
          </div>
          <div class="history-column">
            <h4>最近打开</h4>
            <div id="history-snippet-list" class="history-list"></div>
            <p id="history-snippet-empty" class="empty-tip">暂无打开记录</p>
          </div>
        </div>
        <div class="dialog-buttons">
          <button id="btn-history-clear" class="btn danger push-left" type="button">清空记录</button>
          <button id="btn-history-close" class="btn" type="button">关闭</button>
        </div>
      </div>
      <div class="resize-handle"></div>
    </dialog>

    <!-- 确认弹窗 -->
    <dialog id="confirm-dialog" class="dialog resizable-dialog">
      <div class="dialog-box confirm-box">
        <h3 id="confirm-title" class="drag-handle">确认</h3>
        <p id="confirm-message"></p>
        <div id="confirm-buttons" class="dialog-buttons"></div>
      </div>
      <div class="resize-handle"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
